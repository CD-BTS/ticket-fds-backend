services:
  mysql:
    image: mysql:8.0
    container_name: fairticket-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: fairticket_db
      MYSQL_USER: user
      MYSQL_PASSWORD: userpassword
      TZ: Asia/Seoul
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: